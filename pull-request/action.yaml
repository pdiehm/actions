name: Pull Request
description: Create pull request

inputs:
  token:
    description: Token with PR write access
    default: ${{ github.token }}

  branch:
    description: Name for head branch
    required: true

runs:
  using: composite
  steps:
    - name: Detect Changes
      shell: bash
      id: detect-changes
      run: echo "count=$(git rev-list --count "@{u}..")" >> "$GITHUB_OUTPUT"

    - name: Push Branch
      shell: bash
      if: steps.detect-changes.outputs.count > 0
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        git checkout -B "$BRANCH"
        git push --force origin "$BRANCH"

    - name: Create Pull Request
      shell: bash
      if: steps.detect-changes.outputs.count > 0
      env:
        HEAD: ${{ inputs.branch }}
        BASE: ${{ github.ref_name }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        COUNT="$(gh pr list --base "$BASE" --head "$HEAD" --json id --jq length)"
        if ((COUNT == 0)); then gh pr create --fill --base "$BASE" --head "$HEAD"; fi
